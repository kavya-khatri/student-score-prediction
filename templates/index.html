<!DOCTYPE html>
<html>
<head>
    <title>Student Score Prediction</title>

    <style>
        body {
            font-family: Arial;
            background-color: #f2f2f2;
            text-align: center;
            padding-top: 50px;
        }

        .container {
            background: white;
            width: 400px;
            margin: auto;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px gray;
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 10px;
        }

        button {
            padding: 10px 20px;
            background-color: blue;
            color: white;
            border: none;
            cursor: pointer;
        }

        h1 {
            color: #333;
        }

        h2 {
            color: green;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Student Score Prediction System</h1>

    <form action="/predict" method="post">

        <input type="number" step="any" name="hours" placeholder="Hours Studied" required>

        <input type="number" step="any" name="attendance" placeholder="Attendance %" required>

        <input type="number" step="any" name="tests" placeholder="Practice Tests" required>

        <button type="submit">Predict Score</button>

    </form>

    <h2>{{ prediction_text }}</h2>

</div>

</body>
</html>
